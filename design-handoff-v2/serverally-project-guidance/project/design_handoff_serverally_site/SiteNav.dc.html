<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position: relative;">
  <header style="background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid #E2E8F0;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 11px clamp(20px, 4vw, 32px); display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <a href="Home.dc.html" style="display: flex; align-items: center; text-decoration: none; flex-shrink: 0;">
        <img src="marketing-brief/assets/logo/serverally-logo.svg" alt="ServerAlly" style="height: 32px; display: block;">
      </a>
      <sc-if value="{{ isMd }}" hint-placeholder-val="{{ true }}">
        <nav style="display: flex; align-items: center; gap: 2px;">
          <a href="Home.dc.html" style="position: relative; font-size: 14px; font-weight: 500; color: #334155; text-decoration: none; padding: 7px 13px; transition: color 200ms;" style-hover="color: #5048E5;">Home<sc-if value="{{ activeHome }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 50%; bottom: 0; width: 16px; height: 3px; border-radius: 999px; background: linear-gradient(90deg, #6D5EF3, #A855F7); transform: translateX(-50%);"></span></sc-if></a>
          <a href="How It Works.dc.html" style="position: relative; font-size: 14px; font-weight: 500; color: #334155; text-decoration: none; padding: 7px 13px; transition: color 200ms; white-space: nowrap;" style-hover="color: #5048E5;">How It Works<sc-if value="{{ activeHow }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 50%; bottom: 0; width: 16px; height: 3px; border-radius: 999px; background: linear-gradient(90deg, #6D5EF3, #A855F7); transform: translateX(-50%);"></span></sc-if></a>
          <a href="Pricing.dc.html" style="position: relative; font-size: 14px; font-weight: 500; color: #334155; text-decoration: none; padding: 7px 13px; transition: color 200ms;" style-hover="color: #5048E5;">Pricing<sc-if value="{{ activePricing }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 50%; bottom: 0; width: 16px; height: 3px; border-radius: 999px; background: linear-gradient(90deg, #6D5EF3, #A855F7); transform: translateX(-50%);"></span></sc-if></a>
          <a href="Trust and Security.dc.html" style="position: relative; font-size: 14px; font-weight: 500; color: #334155; text-decoration: none; padding: 7px 13px; transition: color 200ms; white-space: nowrap;" style-hover="color: #5048E5;">Trust &amp; Security<sc-if value="{{ activeTrust }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 50%; bottom: 0; width: 16px; height: 3px; border-radius: 999px; background: linear-gradient(90deg, #6D5EF3, #A855F7); transform: translateX(-50%);"></span></sc-if></a>
        </nav>
      </sc-if>
      <div style="display: flex; align-items: center; gap: 10px;">
        <sc-if value="{{ isMd }}" hint-placeholder-val="{{ true }}">
          <a href="Pricing.dc.html" style="display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #6D5EF3, #8B5CF6 55%, #A855F7); color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600; padding: 9px 19px; border-radius: 9999px; box-shadow: 0 6px 18px rgba(109, 94, 243, 0.3); transition: box-shadow 250ms, transform 250ms; white-space: nowrap;" style-hover="box-shadow: 0 10px 26px rgba(109, 94, 243, 0.42); transform: translateY(-1px); color: #FFFFFF;">
            Start free
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
          </a>
        </sc-if>
        <sc-if value="{{ isMobileNav }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ toggleMenu }}" aria-label="Menu" style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; background: #F1F5F9; border: 1px solid #E2E8F0; border-radius: 10px; cursor: pointer; color: #0F172A;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
          </button>
        </sc-if>
      </div>
    </div>
  </header>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; top: 100%; left: 0; right: 0; background: #FFFFFF; border-bottom: 1px solid #E2E8F0; box-shadow: 0 24px 48px rgba(15, 23, 42, 0.12); padding: 14px clamp(20px, 4vw, 32px) 20px; display: flex; flex-direction: column; gap: 2px;">
      <a href="Home.dc.html" onClick="{{ closeMenu }}" style="font-size: 16px; font-weight: 500; color: #0F172A; text-decoration: none; padding: 11px 4px;">Home</a>
      <a href="How It Works.dc.html" onClick="{{ closeMenu }}" style="font-size: 16px; font-weight: 500; color: #0F172A; text-decoration: none; padding: 11px 4px;">How It Works</a>
      <a href="Pricing.dc.html" onClick="{{ closeMenu }}" style="font-size: 16px; font-weight: 500; color: #0F172A; text-decoration: none; padding: 11px 4px;">Pricing</a>
      <a href="Trust and Security.dc.html" onClick="{{ closeMenu }}" style="font-size: 16px; font-weight: 500; color: #0F172A; text-decoration: none; padding: 11px 4px;">Trust &amp; Security</a>
      <a href="Pricing.dc.html" onClick="{{ closeMenu }}" style="margin-top: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, #6D5EF3, #8B5CF6 55%, #A855F7); color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600; padding: 12px 20px; border-radius: 9999px;">Start free</a>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1440, &quot;height&quot;: 64 },
  &quot;active&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;home&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;how&quot;, &quot;pricing&quot;, &quot;trust&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Nav&quot; }
}">
class Component extends DCLogic {
  state = {
    w: (typeof window !== 'undefined' && window.innerWidth) || 1280,
    menuOpen: false
  };

  componentDidMount() {
    this._onResize = () => {
      const w = window.innerWidth;
      if (w !== this.state.w) this.setState({ w });
    };
    window.addEventListener('resize', this._onResize);
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
  }

  renderVals() {
    const w = this.state.w;
    const isMd = w >= 920;
    const active = String(this.props.active ?? 'home').toLowerCase();
    return {
      isMd,
      isMobileNav: !isMd,
      menuOpen: this.state.menuOpen && !isMd,
      toggleMenu: () => this.setState((s) => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      activeHome: active === 'home',
      activeHow: active === 'how',
      activePricing: active === 'pricing',
      activeTrust: active === 'trust'
    };
  }
}

</script>
</body>
</html>
