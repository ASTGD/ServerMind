# ServerAlly frontend — serves the built SPA and proxies API/WS to the backend.
# Sits behind the CyberPanel/OpenLiteSpeed reverse proxy that terminates SSL.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API → backend
    location /api/ {
        # nginx defaults to 1 MB, which silently turned every file-manager upload over that
        # size into a raw "413 Request Entity Too Large" page. Set ABOVE the backend's own
        # 64 MB cap so an oversized upload gets the app's explanation rather than this.
        client_max_body_size 80m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Health check passthrough
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # WebSocket (terminal / chat / playbook-run) → backend
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MCP server (Streamable HTTP) → backend. No buffering + long timeout for streaming
    # and start/poll long ops (docs/MCP-SERVER-PLAN.md).
    #
    # The MCP endpoint is a single path. The backend serves it at /mcp/ (the SDK routes
    # the streamable app at "/" mounted under /mcp), so a client hitting exactly /mcp
    # (no slash) would get the mount's trailing-slash redirect — which the SDK emits as
    # an http:// absolute URL, so following it DROPS the Authorization header and the
    # session 401s. Rewrite the no-slash form to the backend's /mcp/ internally so the
    # client never sees a redirect. X-Forwarded-Proto is pinned https (Caddy terminates
    # TLS in front of nginx).
    location = /mcp {
        proxy_pass http://backend:8000/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /mcp {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MCP OAuth 2.1 authorization server — root-level endpoints → backend.
    # (/.well-known metadata, /oauth/consent, and /authorize /token /register /revoke)
    location /.well-known/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /oauth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(authorize|token|register|revoke)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — every other path serves index.html
    location / {
        # index.html is the POINTER to the current content-hashed bundle, and it must
        # never be cached. /assets/ above is cached for a year (safe — those filenames
        # change on every build), so a stale index.html does not just delay an update,
        # it pins the browser to the previous build indefinitely: the old asset names
        # it names are still cached and still valid. Symptom is a deploy that appears
        # to work everywhere except for returning users, which is the hardest kind to
        # notice. Revalidating costs one 304 with no body.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
