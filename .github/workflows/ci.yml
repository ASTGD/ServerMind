name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # About twenty tests exercise real SQL against a real Postgres — the ones checking
    # ownership, cascades and constraints, which a fake session cannot answer honestly. With
    # no database here they failed on connect, and because they failed the "Ally evals" step
    # below never ran at all: it is a later step in the same job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: servermind
          POSTGRES_PASSWORD: servermind
          POSTGRES_DB: servermind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U servermind"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Same shape as the local dev URL, so a test that reads it needs no CI special case.
      DATABASE_URL: postgresql+asyncpg://servermind:servermind@localhost:5432/servermind
      SECRET_KEY: ci-secret-not-a-real-key
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Create the schema
        run: alembic upgrade head

      - name: Run tests
        run: pytest
      - name: Ally evals (deterministic gate)
        # docs/EVAL-DRIVEN-DEV.md — the offline eval suite (skill routing, safety
        # blocklist, read-only guard) as an explicit, readable gate. No API, no DB.
        # Exits non-zero on any regression, printing the per-category pass-rate.
        run: python -m app.evals run

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        # npm install (not ci) tolerates cross-platform optional-dep differences
        # in the lockfile (e.g. @emnapi/* native-fallback packages).
        run: npm install --no-audit --no-fund
      - name: Unit tests
        # Vitest covers the pure logic a typecheck can't — server-name detection
        # (message targeting) and the stable per-server colors.
        run: npm test
      - name: Typecheck + build
        # `npm run build` runs `tsc -b && vite build` — tsc -b is the real
        # typecheck for this project-references setup (tsc --noEmit is hollow here).
        run: npm run build
