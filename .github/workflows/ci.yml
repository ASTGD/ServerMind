name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest
      - name: Ally evals (deterministic gate)
        # docs/EVAL-DRIVEN-DEV.md — the offline eval suite (skill routing, safety
        # blocklist, read-only guard) as an explicit, readable gate. No API, no DB.
        # Exits non-zero on any regression, printing the per-category pass-rate.
        run: python -m app.evals run

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        # npm install (not ci) tolerates cross-platform optional-dep differences
        # in the lockfile (e.g. @emnapi/* native-fallback packages).
        run: npm install --no-audit --no-fund
      - name: Unit tests
        # Vitest covers the pure logic a typecheck can't — server-name detection
        # (message targeting) and the stable per-server colors.
        run: npm test
      - name: Typecheck + build
        # `npm run build` runs `tsc -b && vite build` — tsc -b is the real
        # typecheck for this project-references setup (tsc --noEmit is hollow here).
        run: npm run build
